name: Cloudflare PR Preview

on:
  pull_request:

permissions:
  contents: read

jobs:
  preview:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
    - name: Require preview Access configuration
      env:
        PREVIEW_ACCESS_READY: ${{ vars.CLOUDFLARE_PREVIEW_ACCESS_READY }}
      run: |
        if [ "$PREVIEW_ACCESS_READY" != "true" ]; then
          echo "::error::Configure Cloudflare Access for pronounce-game previews, then set the CLOUDFLARE_PREVIEW_ACCESS_READY repository variable to true."
          exit 1
        fi

    - name: Checkout code
      uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build
      run: npm run build

    - name: Validate preview database configuration
      run: node --test test/preview-config.test.js

    - name: Apply preview database migrations
      run: npx wrangler d1 migrations apply PREVIEW_DB --remote --config wrangler.preview-migrations.jsonc
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    - name: Deploy PR preview
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        output_file="$(mktemp "$RUNNER_TEMP/wrangler-preview.XXXXXX")"
        trap 'rm -f -- "$output_file"' EXIT
        export WRANGLER_OUTPUT_FILE_PATH="$output_file"
        npx wrangler preview --name "pr-$PR_NUMBER" --ignore-base-config --json
        preview_url="$(jq -ser '
          map(select(.type == "preview" and .version == 1)) |
          if length == 1 then
            .[0].preview_urls[0] as $url |
            if ($url | type) == "string" and ($url | length) > 0 then
              $url
            else
              error("Preview deployed, but Cloudflare returned no preview URL. Enable a preview host for the Worker; see README.")
            end
          else
            error("Expected one Wrangler preview result")
          end
        ' "$output_file")"
        printf '## Cloudflare PR preview\n\n%s\n' "$preview_url" >> "$GITHUB_STEP_SUMMARY"
