<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Say It! Pronunciation Game</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <canvas id="scene" aria-hidden="true"></canvas>

  <header class="topbar">
    <div class="stats">
      <span>Score <b id="score">0</b></span>
      <span>Streak <b id="streak">0</b></span>
      <span id="progress"></span>
    </div>
    <div class="level-ctl">
      <label for="levelSel">Level</label>
      <select id="levelSel">
        <option value="1">1 - Easy</option>
        <option value="2">2 - Timed: 1 minute</option>
        <option value="3">3 - Hidden word</option>
        <option value="4">4 - Speechless</option>
        <option value="5">5 - Pronounciation Guide Only</option>
        <option value="6">6 - Spelling</option>
      </select>
    </div>
    <div class="menu-wrap">
      <button id="menuBtn" class="btn small" aria-haspopup="true" aria-expanded="false">☰ Menu</button>
      <div id="menu" class="menu" hidden>
        <label for="listSel">Word list</label>
        <select id="listSel"></select>
        <button id="viewWordsBtn" class="btn small">📖 View words</button>
        <button id="uploadBtn" class="btn small" aria-describedby="uploadHint">⬆ Upload list (.txt)</button>
        <p id="uploadHint" class="hint">Text file with one word per line. Syllables and pronunciation are generated automatically.</p>
        <input id="fileInput" type="file" accept=".txt,text/plain" hidden />
        <button id="deleteListBtn" class="btn small ghost">Delete this list</button>
        <div id="uploadStatus" role="status"></div>
        <!-- Labels at bottom of menu -->
        <div class="menu-labels">
          <span class="label-by">By</span>
          <span class="label-company">Boundless Tallawah Software</span>
          <span id="versionLabel" class="label-version"></span>
        </div>
      </div>
    </div>
  </header>

  <main class="stage">
    <div id="timer" class="timer" hidden></div>
    <div id="loader" class="loader" role="status" hidden><span class="spinner"></span><span>Loading words…</span></div>
    <div id="word" class="word"></div>
    <div id="syllables" class="syllables"></div>
    <div id="ipa" class="ipa"></div>
    <button id="sayBtn" class="btn big">🔊 Say word</button>
    <div id="feedback" class="feedback" role="status" aria-live="polite"></div>
    <button id="nextBtn" class="btn big accent" hidden>Next word ➜</button>
  </main>

  <div class="mic-zone">
    <button id="micBtn" class="mic" aria-label="Microphone" disabled>
      <span id="micLabel">Wait…</span>
    </button>
  </div>

  <dialog id="wordsDlg" class="words-dlg">
    <h2 id="wordsTitle"></h2>
    <div id="wordsBody" class="words-body"></div>
    <button id="downloadWordsBtn" class="btn small">⬇ Download words + syllables</button>
    <button id="wordsClose" class="btn small">Close</button>
  </dialog>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
